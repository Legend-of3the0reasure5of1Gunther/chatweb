version: '3.8'

services:
  # 主后端服务
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: securechat-backend
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data/uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - database
      - redis
    networks:
      - securechat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 数据库服务
  database:
    image: postgres:15-alpine
    container_name: securechat-db
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: ${DB_USER:-securechat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - securechat-network
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securechat_user}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: securechat-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - securechat-network
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: securechat-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://api.securechat.example.com
    depends_on:
      - backend
    networks:
      - securechat-network
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: securechat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - securechat-network
    restart: unless-stopped

  # 监控服务
  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring.Dockerfile
    container_name: securechat-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring:/app/monitoring
      - ./logs:/app/logs:ro
    networks:
      - securechat-network
    restart: unless-stopped

networks:
  securechat-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: