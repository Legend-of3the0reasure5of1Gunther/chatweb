# 服务器主配置
server:
  name: "SecureChat Server"
  version: "1.0.0"
  environment: "production"
  
  # 监听配置
  host: "0.0.0.0"
  port: 8080
  workers: ${SERVER_WORKERS:-4}
  
  # SSL配置
  ssl:
    enabled: ${SSL_ENABLED:-true}
    certificate: ${SSL_CERT_PATH:-/app/ssl/certificate.pem}
    private_key: ${SSL_KEY_PATH:-/app/ssl/private.key}
    ca_bundle: ${SSL_CA_PATH:-/app/ssl/ca_bundle.pem}
    min_version: "TLSv1.2"
    ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
  
  # 安全头
  security_headers:
    hsts:
      enabled: true
      max_age: 31536000
      include_subdomains: true
      preload: true
    content_security_policy: |
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' wss://*;
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
  
  # 请求限制
  limits:
    max_body_size: "10mb"
    max_url_size: "1kb"
    max_fields: 100
    max_files: 10
    max_field_size: "2mb"
    upload_timeout: "5m"
  
  # 性能优化
  performance:
    keep_alive_timeout: 65
    request_timeout: 30
    response_timeout: 30
    compression:
      enabled: true
      level: 6
      threshold: 1024
    etag: true
    cache_control: true
  
  # 日志中间件
  logging:
    format: "combined"
    skip_paths: ["/health", "/metrics"]
    request_id: true
  
  # 健康检查
  health_check:
    enabled: true
    path: "/health"
    interval: 30
    timeout: 5